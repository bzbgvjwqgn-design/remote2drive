# ---------------------------------------------------------------------------
# Single-VPS deployment: Postgres + Redis + app (web & worker) + Caddy TLS.
#
#   cp .env.example .env    # then edit every secret
#   docker compose up -d --build
#
# Scale out later with docker-compose.worker.yml / docker-compose.web.yml on
# additional VPS nodes pointing at the same DATABASE_URL and REDIS_URL.
# ---------------------------------------------------------------------------

name: remote-to-drive

x-app-env: &app-env
  ROLE: ${ROLE:-both}
  NODE_ENV: ${NODE_ENV:-production}
  HOST: 0.0.0.0
  PORT: 8080
  LOG_LEVEL: ${LOG_LEVEL:-info}
  APP_URL: ${APP_URL}
  NODE_ID: ${NODE_ID:-}
  ADMIN_EMAILS: ${ADMIN_EMAILS:-}
  SESSION_SECRET: ${SESSION_SECRET}
  TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
  GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
  DATABASE_URL: ${DATABASE_URL:-postgresql://r2d:r2d@postgres:5432/r2d?schema=public}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379}
  QUEUE_REDIS_URL: ${QUEUE_REDIS_URL:-}
  QUEUE_NAME: ${QUEUE_NAME:-transfer}
  MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-4}
  JOB_TIMEOUT_MS: ${JOB_TIMEOUT_MS:-3600000}
  LEASE_TTL_MS: ${LEASE_TTL_MS:-60000}
  LEASE_HEARTBEAT_MS: ${LEASE_HEARTBEAT_MS:-20000}
  LEASE_REAPER_INTERVAL_MS: ${LEASE_REAPER_INTERVAL_MS:-15000}
  MAX_ATTEMPTS: ${MAX_ATTEMPTS:-5}
  RETRY_BASE_DELAY_MS: ${RETRY_BASE_DELAY_MS:-5000}
  RETRY_MAX_DELAY_MS: ${RETRY_MAX_DELAY_MS:-900000}
  WORKER_LOCK_DURATION_MS: ${WORKER_LOCK_DURATION_MS:-120000}
  CHUNK_SIZE_MB: ${CHUNK_SIZE_MB:-16}
  MAX_FILE_SIZE_BYTES: ${MAX_FILE_SIZE_BYTES:-10737418240}
  MAX_ACTIVE_JOBS_PER_USER: ${MAX_ACTIVE_JOBS_PER_USER:-5}
  MAX_URLS_PER_REQUEST: ${MAX_URLS_PER_REQUEST:-20}
  BANDWIDTH_LIMIT_BPS: ${BANDWIDTH_LIMIT_BPS:-0}
  ON_DUPLICATE: ${ON_DUPLICATE:-rename}
  DRIVE_ROOT_FOLDER_ID: ${DRIVE_ROOT_FOLDER_ID:-}
  MAX_REDIRECTS: ${MAX_REDIRECTS:-5}
  ALLOWED_PORTS: ${ALLOWED_PORTS:-80,443}
  CONNECT_TIMEOUT_MS: ${CONNECT_TIMEOUT_MS:-15000}
  IDLE_TIMEOUT_MS: ${IDLE_TIMEOUT_MS:-60000}
  REQUEST_TIMEOUT_MS: ${REQUEST_TIMEOUT_MS:-900000}
  SSRF_ALLOW_PRIVATE: ${SSRF_ALLOW_PRIVATE:-false}
  SSRF_EXTRA_BLOCKED_CIDRS: ${SSRF_EXTRA_BLOCKED_CIDRS:-}
  SSRF_EXTRA_ALLOWED_CIDRS: ${SSRF_EXTRA_ALLOWED_CIDRS:-}
  USER_AGENT: ${USER_AGENT:-remote-to-drive/1.0}
  APP_VERSION: ${APP_VERSION:-1.0.0}
  TRUST_PROXY: "true"
  RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-300}
  RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-60 seconds}
  JOB_SUBMIT_RATE_MAX: ${JOB_SUBMIT_RATE_MAX:-20}
  JOB_SUBMIT_RATE_WINDOW: ${JOB_SUBMIT_RATE_WINDOW:-10 minutes}
  CORS_ORIGINS: ${CORS_ORIGINS:-}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-r2d}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-r2d}
      POSTGRES_DB: ${POSTGRES_DB:-r2d}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-r2d} -d ${POSTGRES_DB:-r2d}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    # Intentionally not published to the host. Reach it from other VPS nodes by
    # publishing "5432:5432" here and firewalling that port to your node IPs.
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  # One-shot: applies prisma/migrations then exits. `app` waits for it.
  migrate:
    build: .
    image: remote-to-drive:latest
    restart: "no"
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "true"
    command: ["sh", "-c", "node ./node_modules/prisma/build/index.js migrate deploy"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  app:
    build: .
    image: remote-to-drive:latest
    restart: unless-stopped
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8080:8080"
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    networks: [internal]

volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:

networks:
  internal:
    driver: bridge
