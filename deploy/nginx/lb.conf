# ---------------------------------------------------------------------------
# Nginx load balancer for multiple WEB VPS nodes.
#
# Put this on a dedicated edge box (or the primary VPS). Terminate TLS here
# with certbot, then round-robin to every web node's published 8080.
#
#   sudo apt-get install -y nginx certbot python3-certbot-nginx
#   sudo cp deploy/nginx/lb.conf /etc/nginx/sites-available/remote-to-drive
#   sudo ln -s /etc/nginx/sites-available/remote-to-drive /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d drive.example.com
#
# Caddy users: deploy/caddy/Caddyfile does the same thing with zero-config TLS.
# ---------------------------------------------------------------------------

# Every web VPS in the fleet. `max_fails` + `fail_timeout` give passive health
# checking; `backup` nodes only take traffic when all primaries are down.
upstream r2d_web {
    least_conn;

    server 203.0.113.11:8080 max_fails=3 fail_timeout=15s;   # vps-web-01
    server 203.0.113.12:8080 max_fails=3 fail_timeout=15s;   # vps-web-02
    server 203.0.113.13:8080 max_fails=3 fail_timeout=15s;   # vps-web-03
    # server 203.0.113.99:8080 backup;

    keepalive 32;
}

# Redirect plain HTTP to HTTPS. certbot manages the ACME challenge location.
server {
    listen 80;
    listen [::]:80;
    server_name drive.example.com;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name drive.example.com;

    ssl_certificate     /etc/letsencrypt/live/drive.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drive.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 2m;   # the app streams from URLs, never from uploads

    location / {
        proxy_pass http://r2d_web;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";
    }

    # Server-Sent Events: buffering off is mandatory or progress stalls until
    # the buffer fills, and the long read timeout keeps the stream alive.
    location /api/events {
        proxy_pass http://r2d_web;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
        chunked_transfer_encoding on;
    }
}
